<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 720 220">
  <title>eddinos2 cat and raven banner</title>
  <desc>A dark, minimal banner with a cat and raven beside a concise security research tagline.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.54" stop-color="#11141d"/>
      <stop offset="1" stop-color="#140f1d"/>
    </linearGradient>
    <radialGradient id="moon" cx="44%" cy="36%" r="68%">
      <stop offset="0" stop-color="#b996ff" stop-opacity="0.78"/>
      <stop offset="0.42" stop-color="#6f43c9" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#2d194f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7bb8bd" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#7bb8bd" stop-opacity="0.75"/>
      <stop offset="0.58" stop-color="#d7a86e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d7a86e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .panel { fill: url(#panel); stroke: #344050; stroke-width: 1.2; }
      .moon { fill: url(#moon); }
      .ink { fill: #05070b; }
      .edge { stroke: #2d3543; stroke-width: 1.2; }
      .eye { fill: #b996ff; }
      .star { fill: #8061d9; opacity: 0.7; }
      .rail { stroke: url(#rail); stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 1 11; }
      .name {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 33px;
        font-weight: 800;
        letter-spacing: 0;
        fill: #d8dee9;
      }
      .tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 16px;
        font-weight: 600;
        fill: #8f9aa8;
        letter-spacing: 0;
      }
      .accent { fill: #d7a86e; }
      .cool { fill: #7bb8bd; }
      .quiet { fill: #687484; }
      @media (prefers-reduced-motion: no-preference) {
        .rail { animation: drift 9s linear infinite; }
        .eye { animation: blink 8s ease-in-out infinite; }
        .star-a { animation: star 6s ease-in-out infinite; }
        .star-b { animation: star 7.5s ease-in-out infinite reverse; }
      }
      @keyframes drift { to { stroke-dashoffset: -120; } }
      @keyframes blink {
        0%, 91%, 100% { opacity: 1; }
        94% { opacity: 0.15; }
      }
      @keyframes star {
        0%, 100% { opacity: 0.35; }
        48% { opacity: 0.95; }
      }
    </style>
  </defs>

  <rect class="panel" x="8" y="8" width="704" height="204" rx="8"/>
  <circle class="moon" cx="126" cy="84" r="92"/>
  <circle class="star star-a" cx="75" cy="42" r="2.2"/>
  <circle class="star star-b" cx="176" cy="44" r="1.8"/>
  <circle class="star" cx="196" cy="112" r="1.5"/>
  <circle class="star star-a" cx="50" cy="126" r="1.4"/>
  <path class="rail" d="M250 164 H640"/>

  <g transform="translate(42 48)" filter="url(#glow)">
    <path class="ink edge" d="M55 36 L75 14 L83 48 Q101 62 98 98 Q94 139 60 139 Q25 139 22 99 Q19 63 37 48 L45 14 Z"/>
    <path class="ink" d="M23 101 C4 98 -7 80 10 69 C22 62 30 73 25 84 C21 94 32 99 44 99"/>
    <ellipse class="ink" cx="62" cy="118" rx="30" ry="24"/>
    <circle class="eye" cx="49" cy="65" r="3.6"/>
    <circle class="eye" cx="75" cy="65" r="3.6"/>
    <path class="ink edge" d="M130 53 C151 38 174 48 184 70 C191 86 184 106 164 112 C143 119 123 107 119 86 C116 70 120 61 130 53 Z"/>
    <path class="ink edge" d="M120 64 L92 58 L121 50"/>
    <path class="ink edge" d="M167 107 L183 139"/>
    <path class="ink edge" d="M153 110 L147 139"/>
    <path class="ink edge" d="M134 59 C122 36 134 20 154 25 C146 36 147 48 158 57"/>
    <circle class="eye" cx="147" cy="66" r="3"/>
  </g>

  <g>
    <text class="name" x="252" y="52">eddinos2</text>
    <text class="tag" x="254" y="88"><tspan class="cool">security research</tspan> / reverse engineering</text>
    <text class="tag" x="254" y="115">systems tooling / careful proof</text>
    <text class="tag accent" x="254" y="146">curiosity -&gt; evidence -&gt; tools</text>
    <text class="tag quiet" x="254" y="184">Rust . Python . C . TS . RE . automation</text>
  </g>
</svg>
